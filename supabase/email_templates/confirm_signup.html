<!-- Supabase → Authentication → Emails → Templates → "Confirm sign up".
     Dark-native design: dark emails survive client dark mode untouched,
     while light emails get color-inverted (washed-out buttons). -->
<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#071A2F" style="background:#071A2F;padding:32px 0;font-family:Arial,Helvetica,sans-serif;">
  <tr><td align="center">
    <table width="480" cellpadding="0" cellspacing="0" bgcolor="#0E2440" style="background:#0E2440;border-radius:16px;overflow:hidden;border:1px solid #223247;">
      <tr><td style="padding:30px 32px 22px;text-align:center;border-bottom:2px solid #FFC21A;">
        <!-- Hosted, not attached: email clients will not render a local
             file. The alt text is the fallback that matters — many clients
             block images until the reader asks for them, and a logo-only
             header would then be an empty box. Styled so the words "Passim"
             appear in brand amber when the picture does not. -->
        <img src="https://passimexplore.com/assets/logo-email.png"
             alt="Passim" width="160" height="63"
             style="display:block;margin:0 auto;border:0;outline:none;text-decoration:none;font-size:30px;font-weight:900;color:#FFC21A;letter-spacing:1px;">
      </td></tr>
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 12px;font-size:24px;color:#FFFFFF !important;">Welcome, explorer! 🧭</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#CFC9BB !important;">
          Just walk — the stories find you. Confirm your email to get started.
        </p>
        <table cellpadding="0" cellspacing="0" align="center" style="margin:8px auto 24px;">
          <tr><td bgcolor="#FFC21A" style="background:#FFC21A;border-radius:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 36px;font-size:16px;font-weight:800;color:#071A2F !important;text-decoration:none;">
              <span style="color:#071A2F !important;">Confirm my email</span>
            </a>
          </td></tr>
        </table>
        <p style="margin:0;font-size:12px;line-height:1.6;color:#8a8578 !important;">
          If the button doesn't work, copy this link into your browser:<br>
          <a href="{{ .ConfirmationURL }}" style="color:#FFC21A !important;word-break:break-all;">{{ .ConfirmationURL }}</a>
        </p>
      </td></tr>
      <tr><td style="padding:18px 32px;border-top:1px solid #223247;text-align:center;">
        <p style="margin:0;font-size:11px;color:#7a7466 !important;">
          Didn't create an account? You can safely ignore this email.<br>
          © Passim · passimexplore.com
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
