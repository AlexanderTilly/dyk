# Codemagic CI — builds the Passim iOS app and ships it to TestFlight.
# Kept fully separate from the Akut Jour app: own repo, own Codemagic
# application, own bundle id (app.passim), own App Store record.
# Shared with Akut Jour: the Apple team (Ofelex AB) and therefore the same
# App Store Connect API-key integration.
#
# Setup checklist (see memory: codemagic-ios-lardomar):
#   1. Apple Developer portal → Identifiers → App ID `app.passim`
#      with Background Modes enabled.
#   2. App Store Connect → new app record for app.passim; note its numeric
#      Apple ID and set it as env var APP_STORE_APPLE_ID (not secret).
#   3. Codemagic → Generate certificate, then create an App Store distribution
#      profile in the Apple portal for app.passim, then Fetch profiles.
#      `ios_signing` below only FETCHES — it never creates anything.
#   4. Environment variables → group `mapbox` with MAPBOX_DOWNLOADS_TOKEN
#      (secret sk. token, DOWNLOADS:READ). Already done.
#   5. App Store Connect → TestFlight → Test Information: fill in feedback
#      email and beta review contact, or the beta-review step goes red.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: Akut Jour App Store Connect  # team-wide key (Ofelex AB), shared with the Akut Jour app

    environment:
      groups:
        - mapbox                                  # MAPBOX_DOWNLOADS_TOKEN (secret)
        - appstore                                # APP_STORE_APPLE_ID (not secret)
      flutter: 3.44.1                             # pinned: matches local dev
      xcode: latest
      cocoapods: default
      ios_signing:
        # Reference names of files STORED IN CODEMAGIC (Code signing identities),
        # not names in the Apple portal. The profile must be fetched there first
        # or the build fails with "No matching profiles found".
        provisioning_profiles:
          - Passim App Store
        # No `certificates:` list — the profile already points at the right
        # certificate, and Codemagic shows it as matched (green check).

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FCI_BUILD_DIR/ios/Pods

    scripts:
      - name: Mapbox SDK credentials
        script: |
          # CocoaPods authenticates to Mapbox via ~/.netrc.
          printf "machine api.mapbox.com\n  login mapbox\n  password %s\n" \
            "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze and test
        script: |
          flutter analyze lib test
          flutter test

      - name: Build number from TestFlight
        script: |
          # Always one higher than what is already on TestFlight, so uploads
          # never collide with a previous build.
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null || echo 0)
          echo "NEXT_BUILD=$(($BUILD_NUMBER + 1))" >> $CM_ENV

      - name: CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Apply signing profiles
        script: |
          # Writes /Users/builder/export_options.plist — without this step the
          # IPA build fails with "property list does not exist".
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      # Globs resolve against working_directory, so list both shapes —
      # a missed glob means "No artifacts were found" and nothing reaches
      # TestFlight even though the build goes green.
      - build/ios/ipa/*.ipa
      - ios/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Leave TestFlight distribution manual until the background-location
        # rework lands — early builds are not representative.
        submit_to_app_store: false
      email:
        recipients:
          - alexander@vibesense.se
        notify:
          success: true
          failure: true
